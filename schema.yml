components:
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        platform:
          type: string
          readOnly: true
        external_id:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 50
        avatar_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        integration:
          type: integer
          readOnly: true
      required:
      - created_at
      - external_id
      - id
      - integration
      - platform
      - updated_at
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        contact_detail:
          allOf:
          - $ref: '#/components/schemas/Contact'
          readOnly: true
        platform:
          type: string
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        external_chat_id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/ConversationStatusEnum'
        last_message_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        integration:
          type: integer
          readOnly: true
        contact:
          type: integer
          readOnly: true
      required:
      - contact
      - contact_detail
      - created_at
      - external_chat_id
      - id
      - integration
      - platform
      - unread_count
      - updated_at
    ConversationStatusEnum:
      enum:
      - open
      - closed
      - archived
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
        * `archived` - Archived
    Integration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        name:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/IntegrationStatusEnum'
          readOnly: true
        external_account_id:
          type: string
          readOnly: true
        webhook_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
      required:
      - created_at
      - external_account_id
      - id
