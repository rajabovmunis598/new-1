components:
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        platform:
          type: string
          readOnly: true
        external_id:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 50
        avatar_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        integration:
          type: integer
          readOnly: true
      required:
      - created_at
      - external_id
      - id
      - integration
      - platform
      - updated_at
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        integration:
          type: integer
          readOnly: true
        contact:
          type: integer
          readOnly: true
        contact_detail:
          allOf:
          - $ref: '#/components/schemas/Contact'
          readOnly: true
        platform:
          type: string
          readOnly: true
        external_chat_id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/ConversationStatusEnum'
        is_pinned:
          type: boolean
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        snoozed_until:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact
      - contact_detail
      - created_at
      - external_chat_id
      - id
      - integration
      - platform
      - unread_count
      - updated_at
    ConversationNote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
          readOnly: true
        author:
          type: integer
          readOnly: true
        author_username:
          type: string
          readOnly: true
        text:
          type: string
          maxLength: 5000
          minLength: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - author_username
      - conversation
      - created_at
      - id
      - text
      - updated_at
    ConversationReadResponse:
      type: object
      properties:
        updated:
          type: integer
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
      required:
      - unread_count
      - updated
    ConversationSnooze:
      type: object
      properties:
        snoozed_until:
          type: string
          format: date-time
      required:
      - snoozed_until
    ConversationStatusEnum:
      enum:
      - open
      - closed
      - archived
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
        * `archived` - Archived
    DashboardStatistics:
      type: object
      properties:
        total_messages:
          type: integer
          readOnly: true
        unread_messages:
          type: integer
          readOnly: true
        telegram_messages:
          type: integer
          readOnly: true
        whatsapp_messages:
          type: integer
          readOnly: true
        instagram_messages:
          type: integer
          readOnly: true
        total_conversations:
          type: integer
          readOnly: true
        open_conversations:
          type: integer
          readOnly: true
        total_orders:
          type: integer
          readOnly: true
        new_orders:
          type: integer
          readOnly: true
        completed_orders:
          type: integer
          readOnly: true
      required:
      - completed_orders
      - instagram_messages
      - new_orders
      - open_conversations
      - telegram_messages
      - total_conversations
      - total_messages
      - total_orders
      - unread_messages
      - whatsapp_messages
    ExternalURLResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          nullable: true
      required:
      - url
    GlobalSearchResponse:
      type: object
      properties:
        query:
          type: string
          readOnly: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/GlobalSearchResult'
          readOnly: true
      required:
      - query
      - results
    GlobalSearchResult:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/GlobalSearchResultTypeEnum'
          readOnly: true
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        subtitle:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
        platform:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - id
      - platform
      - status
      - subtitle
      - title
      - type
      - url
    GlobalSearchResultTypeEnum:
      enum:
      - contact
      - conversation
      - order
      - message
      type: string
      description: |-
        * `contact` - contact
        * `conversation` - conversation
        * `order` - order
        * `message` - message
    InstagramOAuthStart:
      type: object
      properties:
        name:
          type: string
          default: Instagram
          maxLength: 255
    InstagramOAuthStartResponse:
      type: object
      properties:
        authorization_url:
          type: string
          format: uri
        expires_in:
          type: integer
          minimum: 1
      required:
      - authorization_url
      - expires_in
    Integration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        name:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/IntegrationStatusEnum'
          readOnly: true
        external_account_id:
          type: string
          readOnly: true
        webhook_url:
          type: string
          format: uri
          readOnly: true
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - external_account_id
      - id
      - last_error
      - last_sync_at
      - name
      - platform
      - status
      - updated_at
      - webhook_url
    IntegrationID:
      type: object
      properties:
        integration_id:
          type: integer
      required:
      - integration_id
    IntegrationStatusEnum:
      enum:
      - active
      - inactive
      - error
      - pending
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `error` - Error
        * `pending` - Pending
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
      - user
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        platform:
          type: string
          readOnly: true
        external_message_id:
          type: string
          readOnly: true
        sender_type:
          allOf:
          - $ref: '#/components/schemas/SenderTypeEnum'
          readOnly: true
        message_type:
          $ref: '#/components/schemas/MessageTypeEnum'
        text:
          type: string
        media_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        external_created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        conversation:
          type: integer
          readOnly: true
        reply_to:
          type: integer
          nullable: true
      required:
      - conversation
      - created_at
      - external_created_at
      - external_message_id
      - id
      - metadata
      - platform
      - sender_type
      - updated_at
    MessageTypeEnum:
      enum:
      - text
      - image
      - video
      - audio
      - document
      - location
      - sticker
      - other
      type: string
      description: |-
        * `text` - Text
        * `image` - Image
        * `video` - Video
        * `audio` - Audio
        * `document` - Document
        * `location` - Location
        * `sticker` - Sticker
        * `other` - Other
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
